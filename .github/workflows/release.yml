name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/smoke_test.py
      - name: Package skill
        run: |
          cd skills
          zip -r ../spetz-logo-design.zip spetz-logo-design -x "*/__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: spetz-logo-design.zip
          generate_release_notes: true
